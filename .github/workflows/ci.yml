name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  #-----------------------------------------------------------
  # Pure protocol unit tests - no OpenRGB/Qt/hidapi required
  #-----------------------------------------------------------
  protocol-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - name: Configure (tests only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUMBRA_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  #-----------------------------------------------------------
  # Full plugin build against official OpenRGB rc3.1 sources
  #-----------------------------------------------------------
  plugin-windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            git

      - name: Clone OpenRGB sources (rc3.1)
        run: |
          git clone --depth 1 --branch release_candidate_1.0rc3.1 \
            https://codeberg.org/OpenRGB/OpenRGB.git "$RUNNER_TEMP/openrgb"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DOPENRGB_SOURCE_DIR="$RUNNER_TEMP/openrgb" \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmbraOpenRGBPlugin-windows
          path: build/libUmbraOpenRGBPlugin.dll
